[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; all_resources 会把项目里的一切都打进 index.pck 并随页面发出去，所以这里排除两类：
;   certs/  —— 自签证书的私钥不该发给任何打开页面的人
;   tools/  —— 开发脚本与临时截图（截图一旦被 Godot 导入，每张都会让包变大几 KB）
exclude_filter="certs/*, tools/*"
export_path="build/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>addEventListener('DOMContentLoaded',function(){var c=document.getElementById('canvas');function lock(n){if(document.pointerLockElement)return;var p=c.requestPointerLock();if(p&&p.catch)p.catch(function(){});if(n>0)setTimeout(function(){lock(n-1)},250)}c.addEventListener('mousedown',function(e){if(e.button!==0||document.pointerLockElement)return;if(document.fullscreenElement){lock(2);return}var p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){lock(2)});document.addEventListener('fullscreenchange',function(){if(document.fullscreenElement)lock(2)},{once:true})})})</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
